keys = ["F1"]
enabled = false
type = 'inline'
val = """
    function run()
        return {
            {cmd = cmd.click, args = {mouse_btn.LMB}, delay = 0.0},
        }
    end
"""
[F1.loop]
enabled = true
times = -1
delay = 0.05

[F12]
keys = ["F12"]
enabled = false
type = 'inline'
val = """
    function run()
        -- a complex macro: multiple instructions, each with an explicit delay
        return {
            {cmd = cmd.click,     args = {mouse_btn.LMB},         delay = 0.0},
            {cmd = cmd.wheel,     args = {wheel_rotation.WU, 1.0}, delay = 100.0},
            {cmd = cmd.translate, args = {0.0, 32, 10},           delay = 50.0},
        }
    end
"""
[F12.loop]
enabled = false
times = 0
delay = 0.0